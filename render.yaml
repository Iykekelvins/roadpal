# Render Blueprint for the RoadPal API (free plan, Frankfurt: same region as the Neon database).
# Render reads this file when you create a "Blueprint" from the repo. Values marked sync: false
# are secrets you paste in during setup; they never live in git.
services:
  - name: roadpal-api
    type: web
    runtime: node
    plan: free
    region: frankfurt
    # `corepack pnpm` runs the exact pnpm pinned in package.json ("packageManager"). Not
    # `corepack enable`: that replaces /usr/bin/pnpm, which is read-only on Render (EROFS).
    # --prod=false: NODE_ENV=production would otherwise skip devDependencies, and the Nest build
    # tools are devDependencies. --filter "@repo/api...": build the API and what it depends on
    # (packages/shared) in order. Migrations run last, so a failed build never touches the database
    # (the free plan has no separate pre-deploy step).
    buildCommand: >-
      corepack pnpm install --frozen-lockfile --prod=false &&
      corepack pnpm --filter "@repo/api..." run build &&
      corepack pnpm --filter @repo/api db:migrate:deploy
    startCommand: node apps/api/dist/main.js
    # Database-free check: Render's pings must not keep Neon awake (see /health/live).
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    # Only redeploy when something the API uses changes (not for web-only commits).
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
        - package.json
        - render.yaml
    envVars:
      # Node 24 LTS: still bundles Corepack (removed from Node 25), and the API's ESM build was
      # verified to start on it (Node 22 fails with ERR_REQUIRE_CYCLE_MODULE).
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Neon production branch: pooled URL (host has "-pooler") for the app, direct for migrations.
      # Both must include sslmode=require; the API refuses to start otherwise.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      # Random 256-bit secret generated by Render; never seen by anyone.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # The Vercel site's https:// URL (comma-separate several). Needed for the live connection.
      - key: WEB_ORIGINS
        sync: false
      # Browser -> Vercel (rewrite) -> Render's load balancer -> API: two proxies in front.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Free demo logins (codes shown in the app). Switch to termii + TERMII_* keys for real SMS.
      - key: SMS_MODE
        value: demo
      # At most 50 login codes a day across the app (worst case ~N400/day once SMS is real).
      - key: OTP_DAILY_LIMIT
        value: "50"
